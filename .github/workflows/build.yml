name: Update mod.js
on:
  schedule:
    - cron: '* * * * *'      # GitHub реально запускает ~каждые 5 минут (минимум) — проверка дешёвая
  workflow_dispatch:         # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install curl-impersonate
        # Cloudflare на devast.io отдаёт 403 голому curl с IP GitHub Actions.
        run: |
          mkdir -p /tmp/ci
          curl -fsSL https://github.com/lexiforest/curl-impersonate/releases/download/v2.2.3/curl-impersonate-v2.2.3.x86_64-linux-gnu.tar.gz -o /tmp/ci.tar.gz
          echo "ca7c8aae49e33260d3a2400db16c7737aaf04692d606a843502056b42990f989  /tmp/ci.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ci.tar.gz -C /tmp/ci
          echo "/tmp/ci" >> "$GITHUB_PATH"
          curl_chrome131 --version | head -1
      - name: Check for new client build
        id: check
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          SITE="https://dev""ast.io"
          curl_chrome131 -fsSL "$SITE/" -o /tmp/site_index.html
          JS=$(grep -o 'js/[A-Za-z0-9_-]*\.js' /tmp/site_index.html | head -1)
          if [ -z "$JS" ]; then echo "no client path in index"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "client: $JS"
          curl_chrome131 -fsSL "$SITE/$JS" -o /tmp/site_client.js
          SHA=$(sha256sum /tmp/site_client.js | cut -d' ' -f1)
          OLD=$(cat state/client.sha256 2>/dev/null || echo none)
          echo "client sha: $SHA (was: $OLD)"
          if [ "$SHA" != "$OLD" ] || [ ! -s mod.js ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.changed == 'true'
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.changed == 'true'
        with:
          python-version: '3.12'
      - name: Rebuild and push mod.js
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x rebuild.sh
          ./rebuild.sh
      - name: Purge jsDelivr cache for mod.js
        if: steps.check.outputs.changed == 'true'
        run: curl -sf "https://purge.jsdelivr.net/gh/petrususanu333/best-te-m@main/mod.js" || true
